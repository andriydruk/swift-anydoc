name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The purity gate is its own job so it reports independently of any
  # compiler failure: "we accidentally took a dependency" and "the code does
  # not build" are different problems and should not share one red X.
  purity:
    name: Purity gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Banned imports, escape hatches, and dependencies
        run: bash scripts/lint-purity.sh

  # Docs are the surface nobody re-reads while working, so they rot silently:
  # the README spent all of phase 6 saying PDF was in progress. Building the
  # catalog is what catches it — a curation list is prose until docc resolves
  # it.
  #
  # macOS because this needs Xcode's docc; adding swift-docc-plugin would
  # trip the purity gate and make the build fetch.
  docs:
    name: Docs gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the DocC catalog, and check every public symbol is curated
        run: bash scripts/lint-docs.sh

  # Linux is the primary target. Apple's closed-source frameworks do not
  # exist here, so a green build is structural proof of the zero-dependency
  # claim rather than a promise — which is why this matrix, not macOS, is
  # what gates a merge.
  linux:
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c ${{ matrix.configuration }}
      - name: Test
        run: swift test -c ${{ matrix.configuration }}

  # macOS proves the library is usable on Apple platforms; it is not the
  # portability gate.
  macos:
    name: macOS (${{ matrix.configuration }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c ${{ matrix.configuration }}
      - name: Test
        run: swift test -c ${{ matrix.configuration }}

  # The library is meant to be embeddable on iOS, which SwiftPM alone will
  # not cross-compile for; xcodebuild is what actually exercises the iOS SDK
  # and would catch an API that only exists on macOS.
  ios:
    name: iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme AnyDoc \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios \
            -quiet
      - name: Confirm the artifact really targets iOS
        # xcodebuild exits 0 for a scheme that resolved to no platform, so
        # the exit code alone does not prove an iOS build happened.
        run: |
          module=.build/ios/Build/Products/Debug-iphonesimulator/AnyDoc.swiftmodule
          test -d "$module" || { echo "no iphonesimulator module produced" >&2; exit 1; }
          ls "$module"

  # ASan guards the one place the library leaves Swift's safety net: the
  # libc `read()` in FileBytes.swift. Everything else parses through
  # bounds-checked `[UInt8]`, where an overrun traps rather than corrupts, so
  # the sanitizer's marginal value is narrow — but that one call is reached
  # by every fixture the suite loads, and a wrong length there is a real
  # overflow.
  #
  # Not on pull requests: a sanitizer build is a full rebuild and costs far
  # more than it returns per-PR, when the mutation sweeps already exercise
  # the parsers much harder. It gates master and can be dispatched by hand.
  sanitizers:
    name: Address sanitizer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: swift:6.1
    # A hung sanitizer must fail loudly, not eat the 6-hour job limit: on
    # macOS this exact command deadlocks inside ASan's own initialization
    # (its malloc interceptor re-enters init via dyld and spins forever).
    # Linux ships a different ASan runtime and does work — confirmed once CI
    # first ran, with all 493 tests passing under it — but the cap stays.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test under ASan
        # LeakSanitizer is on by default alongside ASan on Linux and reports
        # at exit, which failed this job while every test passed. All six
        # reports were *indirect* leaks — 368 bytes — bottoming out in
        # libXCTest and libswiftCore: the runner's own teardown, not the
        # library, which allocates nothing manually. Leak detection is off so
        # the job reports what it was added for: memory-safety errors in the
        # binary parsers. Re-enable with detect_leaks=1 if the library ever
        # takes on manual allocation.
        run: ASAN_OPTIONS=detect_leaks=0 swift test --sanitize=address
